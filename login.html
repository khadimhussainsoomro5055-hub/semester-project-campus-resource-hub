
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Resource Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <!-- Logo and Website Name -->
        <div class="login-header">

            <div class="logo">
                <img src="images/cap-icon.png" alt="Campus Resource Hub logo">
            </div>

            <h1>Campus <span>Resource Hub</span></h1>

            <h3>Sukkur IBA University</h3>

        </div>

        <!-- Login Form -->
        <div class="login-box">

            <div class="login-title">
                <h2>Welcome Back</h2>
                <p>Sign in to your Campus Resource Hub account</p>
                <div class="title-line"></div>
            </div>

            <form id="loginForm" action="#" method="post">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">IBA Email Address</label>

                    <div class="input-box">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your IBA email address"
                            required
                        >
                    </div>

                    <small class="email-note">@iba.edu.pk</small>

                </div>

                <!-- Password -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-box password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <!-- Show / Hide Password -->
                        <button
                            type="button"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="form-options">

                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot password?
                    </a>

                </div>

                <!-- Sign In -->
                <button type="submit" class="login-button">
                    Sign In <span>→</span>
                </button>

            </form>

            <!-- University Information -->
            <div class="login-info">

                <div class="info-icon">🛡</div>

                <div>
                    <h4>University email accounts only</h4>
                    <p>
                        Only Sukkur IBA University email accounts are allowed.
                    </p>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="login-footer">
            © 2026 Campus Resource Hub | Sukkur IBA University
        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
